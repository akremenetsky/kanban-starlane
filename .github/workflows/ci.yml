name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/scanner/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Obsidian's own validation of manifest, versions.json, README, license and the scanner
  # lint rules that the community directory runs on every release.
  obsidian-review:
    name: Obsidian community review checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/scanner/package-lock.json
      - run: npm ci
      - uses: obsidianmd/obsidian-workflows@v1
        with:
          scanner-lint: true
          strict: true

  e2e:
    name: E2E (minimum and latest Obsidian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/scanner/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ hashFiles('manifest.json') }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run test:e2e
        env:
          E2E_VERSIONS: all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: tests/e2e/.artifacts
