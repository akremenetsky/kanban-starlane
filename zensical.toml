[project]
site_name = "Kanban Starlane"
site_description = "Markdown-backed Kanban boards for Obsidian"
site_url = "https://akremenetsky.github.io/kanban-starlane/"
docs_dir = "docs/user-guide"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Coming from the Kanban plugin" = "getting-started/migrating-from-kanban-plugin.md" },
    { "Creating a board" = "getting-started/creating-a-board.md" },
  ] },
  { "Guide" = [
    { "Views" = "guide/views.md" },
    { "Cards and lists" = "guide/cards-and-lists.md" },
    { "Dates and times" = "guide/dates-and-times.md" },
    { "Tags" = "guide/tags.md" },
    { "Linked page metadata" = "guide/linked-page-metadata.md" },
    { "Linked lists" = "guide/linked-lists.md" },
    { "Card history" = "guide/card-history.md" },
    { "Archive" = "guide/archive.md" },
  ] },
  { "Settings" = [
    { "Overview" = "settings/index.md" },
    { "General" = "settings/general.md" },
    { "Tags" = "settings/tags.md" },
    { "Date & time" = "settings/dates-and-time.md" },
    { "Archive" = "settings/archive.md" },
    { "Inline metadata" = "settings/inline-metadata.md" },
    { "Linked page metadata" = "settings/linked-page-metadata.md" },
    { "Board header buttons" = "settings/board-header-buttons.md" },
    { "Board color" = "settings/board-color.md" },
  ] },
  { "FAQ" = "faq.md" },
]

repo_url = "https://github.com/akremenetsky/kanban-starlane"
repo_name = "akremenetsky/kanban-starlane"
edit_uri = "edit/main/docs/user-guide/"

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
